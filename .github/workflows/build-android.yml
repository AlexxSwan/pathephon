name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      # Build с continue-on-error — Flutter ругается "APK не найден"
      # но APK реально создан в android/app/build/outputs/
      - name: Build debug APK
        continue-on-error: true
        run: flutter build apk --debug --no-tree-shake-icons

      # Найти APK и скопировать куда ждёт Flutter
      - name: Find and copy APK
        if: always()
        run: |
          echo "=== Ищем APK ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "(нет)"
          mkdir -p build/app/outputs/flutter-apk/
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-debug.apk
            echo "✓ Скопирован: $APK"
          else
            echo "✗ APK не найден"
          fi

      # Проверка — если APK нет, шаг упадёт → красный крест
      - name: Verify APK exists
        if: always()
        run: |
          if [ ! -f build/app/outputs/flutter-apk/app-debug.apk ]; then
            echo "ERROR: APK не найден!"
            exit 1
          fi
          echo "✓ APK готов"
          ls -lh build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: warn