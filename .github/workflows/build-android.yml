name: Build Android APK

# ============================================================================
#  Pathephon CI/CD — mirrors the audio-converter workflow.
#  Signs release APK with the SAME keystore (uploaded as GitHub Secret).
#
#  Triggers:
#    - push to main     → build + upload artifact
#    - manual dispatch  → same
#    - tag v*           → build + create GitHub Release with APKs attached
# ============================================================================
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write   # required for softprops/action-gh-release on tag builds

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # Use latest stable — older pinned versions (3.24.5, 3.27.5) have
          # engine artifacts missing from Google's Maven repo.
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Get dependencies
        run: flutter pub get

      # ─── Localization generation (no codegen needed otherwise) ───────────
      # Pathephon MVP uses plain Dart models (no Freezed/Drift) so build_runner
      # is NOT required. Only l10n codegen runs.
      - name: Generate l10n
        run: flutter gen-l10n

      - name: Verify analysis
        run: flutter analyze || true

      - name: Run tests
        run: flutter test || true

      # ─── Проверяем, есть ли секреты ─────────────────────────────────────
      # Шаг создаёт output 'has_keystore', который используется в условиях ниже
      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "✓ Keystore secret is set — will build release APK"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "✗ Keystore secret is empty — will build debug APK"
          fi

      # ─── Декодирование keystore ────────────────────────────────────────
      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "Keystore decoded:"
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP
          echo "key.properties created:"
          cat android/key.properties

      # ─── Сборка APK ─────────────────────────────────────────────────────
      # Pathephon ships only x86_64 + arm64-v8a (per design decision).
      # --split-per-abi produces one APK per ABI; abiFilters in build.gradle.kts
      # restricts to those two.
      - name: Build release APK (split per ABI, signed)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: flutter build apk --release --no-tree-shake-icons --split-per-abi

      - name: Build debug APK (split per ABI, unsigned fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        run: flutter build apk --debug --no-tree-shake-icons --split-per-abi

      - name: List built APKs
        run: |
          find build -name "*.apk" -exec ls -lh {} \; || true

      # ─── Загрузка артефактов ────────────────────────────────────────────
      - name: Upload x64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-x86_64
          path: |
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-x86_64-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-arm64-v8a
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk
          retention-days: 30
          if-no-files-found: warn

      # ─── GitHub Release (только при пуше тега v*) ───────────────────────
      - name: Create GitHub Release with APKs
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-x86_64-release.apk
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
