name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Analyze (errors only)
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          if grep -E "^\s*error\s" analyze.log; then
            echo "=== DART ERRORS FOUND - see above ==="
            exit 1
          fi
          echo "No Dart errors found"

      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
          fi

      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP

      # ============================================================
      # Build arm64-only APK. --target-platform android-arm64
      # restricts native libs to arm64-v8a only (~20-25MB).
      # continue-on-error: true because Flutter 3.47.7 has a file
      # watcher bug that throws AFTER the APK is built.
      # ============================================================
      - name: Build release APK (arm64 only)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        continue-on-error: true
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64 2>&1 | tee build.log || true

      - name: Build debug APK fallback
        if: steps.check_keystore.outputs.has_keystore == 'false'
        continue-on-error: true
        run: flutter build apk --debug --no-tree-shake-icons --target-platform android-arm64 2>&1 | tee build.log || true

      # ============================================================
      # Search EVERYWHERE for ANY .apk file. Copy to standard path.
      # ============================================================
      - name: Find and copy APK
        run: |
          echo "=== Searching for APK files everywhere ==="
          find / -name "*.apk" -not -path "*/\.git/*" 2>/dev/null || echo "(none found anywhere)"

          echo ""
          echo "=== build/ directory tree ==="
          find build -type f -name "*.apk" 2>/dev/null || echo "(none in build/)"

          echo ""
          echo "=== flutter-apk dir ==="
          ls -lh build/app/outputs/flutter-apk/ 2>/dev/null || echo "(flutter-apk dir missing)"

          echo ""
          echo "=== apk/release dir ==="
          ls -lh build/app/outputs/apk/release/ 2>/dev/null || echo "(apk/release dir missing)"

          mkdir -p build/app/outputs/flutter-apk/

          # Try standard locations
          APK=""
          for candidate in \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/flutter-apk/app-debug.apk" \
            "build/app/outputs/apk/release/app-release.apk" \
            "build/app/outputs/apk/debug/app-debug.apk"; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              echo "Found at: $candidate"
              break
            fi
          done

          # Last resort: find ANY apk
          if [ -z "$APK" ]; then
            APK=$(find / -name "app-release.apk" -o -name "app-debug.apk" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              echo "Found via global search: $APK"
            fi
          fi

          if [ -z "$APK" ]; then
            APK=$(find / -name "*.apk" -not -path "*/\.git/*" 2>/dev/null | head -1)
            if [ -n "$APK" ]; then
              echo "Found via wildcard search: $APK"
            fi
          fi

          if [ -z "$APK" ]; then
            echo "FATAL: No APK found anywhere on the filesystem"
            echo "=== Last 50 lines of build.log ==="
            tail -50 build.log 2>/dev/null || echo "(no build.log)"
            exit 1
          fi

          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "Copied: $APK -> build/app/outputs/flutter-apk/app-release.apk"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk