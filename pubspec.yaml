name: pathephon
description: All-format retro-tube audio player for modern Android x64.
publish_to: 'none'
version: 0.10.47+141

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  just_audio: ^0.9.39
  audio_session: ^0.1.21
  on_audio_query: ^2.9.0
  permission_handler: ^11.3.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  package_info_plus: ^10.2.2
  google_fonts: ^6.2.1
  palette_generator: ^0.3.3+4
  file_picker: ^13.1.0
  intl: any
  path: ^1.9.0
  uuid: ^4.5.1
  logging: ^1.2.3
  rxdart: ^0.28.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/app_icon.png
    - assets/pathephon.gif

flutter_intl:
  enabled: true
  class_name: AppLocalizations
  main_locale: ru