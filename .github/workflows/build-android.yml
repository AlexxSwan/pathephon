name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Analyze (errors only)
        run: |
          flutter analyze --no-pub --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze.log
          if grep -E "^\s*error\s" analyze.log; then
            echo "=== DART ERRORS FOUND - see above ==="
            exit 1
          fi
          echo "No Dart errors found"

      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Keystore secret is set"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore secret is EMPTY"
          fi

      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP

      - name: Prepare Android project
        run: flutter build apk --config-only --no-tree-shake-icons

      - name: Build APK via Gradle (release)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon 2>&1 | tee gradle.log

      - name: Build APK via Gradle (debug fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle.log

      - name: Find and copy APKs
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "(none)"
          mkdir -p build/app/outputs/flutter-apk/

          ARM64=$(find . -name "app-arm64-v8a-release.apk" 2>/dev/null | head -1)
          if [ -z "$ARM64" ]; then
            ARM64=$(find . -name "app-arm64-v8a-debug.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$ARM64" ]; then
            cp "$ARM64" build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            echo "Copied arm64: $ARM64"
          fi

          X64=$(find . -name "app-x86_64-release.apk" 2>/dev/null | head -1)
          if [ -z "$X64" ]; then
            X64=$(find . -name "app-x86_64-debug.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$X64" ]; then
            cp "$X64" build/app/outputs/flutter-apk/app-x86_64-release.apk
            echo "Copied x86_64: $X64"
          fi

          if [ -z "$ARM64" ] && [ -z "$X64" ]; then
            FAT=$(find . -name "app-release.apk" 2>/dev/null | head -1)
            if [ -z "$FAT" ]; then
              FAT=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
            fi
            if [ -n "$FAT" ]; then
              cp "$FAT" build/app/outputs/flutter-apk/app-release.apk
              echo "Copied fat APK: $FAT"
            fi
          fi

      - name: Upload arm64 APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-arm64-v8a
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload x86_64 APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-x86_64
          path: build/app/outputs/flutter-apk/app-x86_64-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload fat APK artifact (fallback)
        if: always() && steps.check_keystore.outputs.has_keystore == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk