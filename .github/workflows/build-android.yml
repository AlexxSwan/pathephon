name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Build debug APK
        continue-on-error: true
        run: flutter build apk --debug --no-tree-shake-icons

      - name: Find and copy APK
        if: always()
        run: |
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null
          mkdir -p build/app/outputs/flutter-apk/
          APK=$(find . -name "app-debug.apk" 2>/dev/null | head -1)
          if [ -n "$APK" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-debug.apk
          fi

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30
          if-no-files-found: warn