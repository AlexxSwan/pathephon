name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Verify analysis
        run: flutter analyze || true

      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Keystore secret is set"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore secret is EMPTY"
          fi

      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP

      # ============================================================
      # Build with --target-platform android-arm64 for compact APK.
      # continue-on-error: true because Flutter 3.47.7 has a file-watcher
      # bug ("Already watching path") that throws AFTER Gradle finishes.
      # The APK IS built — we just need to find it ourselves.
      # ============================================================
      - name: Build release APK (arm64 only)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        continue-on-error: true
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64

      - name: Build debug APK fallback (arm64 only)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        continue-on-error: true
        run: flutter build apk --debug --no-tree-shake-icons --target-platform android-arm64

      # ============================================================
      # Robust APK discovery: search EVERYWHERE, copy to canonical path.
      # Gradle puts APK in build/app/outputs/apk/release/ or
      # build/app/outputs/flutter-apk/. We search both + anywhere else.
      # ============================================================
      - name: Find and copy APK
        run: |
          echo "=== All APK files in repo ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "(none found)"
          echo ""
          mkdir -p build/app/outputs/flutter-apk/
          # Try common locations in order of preference
          APK=""
          for candidate in \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/apk/release/app-release.apk" \
            "build/app/outputs/flutter-apk/app-debug.apk" \
            "build/app/outputs/apk/debug/app-debug.apk"; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          # Last resort: find any apk
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "FATAL: No APK produced by build"
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "Copied: $APK"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk