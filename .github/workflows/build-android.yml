name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      # БЕЗ continue-on-error — увидим реальную ошибку
      - name: Build debug APK (FULL LOG)
        run: flutter build apk --debug --no-tree-shake-icons --target-platform android-arm64 --verbose 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
          if-no-files-found: warn

      - name: Find APK
        if: always()
        run: |
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "(no APK)"
          find android/app/build -type f 2>/dev/null | head -20 || echo "(no files in android/app/build)"