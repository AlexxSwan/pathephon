name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      # ============================================================
      # Run flutter analyze BEFORE build - shows real Dart errors.
      # ============================================================
      - name: Analyze Dart code (verbose)
        run: flutter analyze --no-pub

      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Keystore secret is set"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore secret is EMPTY"
          fi

      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP

      # ============================================================
      # Run build with -v (verbose) to capture the REAL Dart error.
      # Don't use --config-only — we want the full error output.
      # ============================================================
      - name: Build release APK (verbose, fail-fast)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        run: flutter build apk --release --no-tree-shake-icons --target-platform android-arm64 -v

      - name: Build debug APK fallback
        if: steps.check_keystore.outputs.has_keystore == 'false'
        run: flutter build apk --debug --no-tree-shake-icons --target-platform android-arm64 -v

      - name: Find and copy APK
        if: always()
        run: |
          echo "=== All APK files ==="
          find . -name "*.apk" -exec ls -lh {} \; 2>/dev/null || echo "(none)"
          mkdir -p build/app/outputs/flutter-apk/
          APK=""
          for candidate in \
            "build/app/outputs/apk/release/app-release.apk" \
            "build/app/outputs/apk/debug/app-debug.apk" \
            "build/app/outputs/flutter-apk/app-release.apk" \
            "build/app/outputs/flutter-apk/app-debug.apk"; do
            if [ -f "$candidate" ]; then
              APK="$candidate"
              break
            fi
          done
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -n "$APK" ]; then
            cp "$APK" build/app/outputs/flutter-apk/app-release.apk
            echo "Copied: $APK"
          else
            echo "No APK found (build likely failed - check logs above)"
          fi

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-arm64
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk