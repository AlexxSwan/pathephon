name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Show versions
        run: |
          flutter --version
          dart --version

      - name: Clean
        run: flutter clean

      - name: Get dependencies
        run: flutter pub get

      - name: Generate l10n
        run: flutter gen-l10n

      - name: Check if keystore secret is set
        id: check_keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "has_keystore=true" >> $GITHUB_OUTPUT
            echo "Keystore secret is set"
          else
            echo "has_keystore=false" >> $GITHUB_OUTPUT
            echo "Keystore secret is EMPTY"
          fi

      - name: Decode keystore from secrets
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          ls -lh android/app/upload-keystore.jks
          file android/app/upload-keystore.jks

      - name: Create key.properties
        if: steps.check_keystore.outputs.has_keystore == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > android/key.properties << PROP
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=upload-keystore.jks
          PROP

      # ============================================================
      # STEP 1: Compile Dart + prepare Android project (NO Gradle).
      # --config-only means: generate .android_config, compile Dart
      # to kernel/snapshot, write local.properties — but DON'T run
      # any Gradle task. This avoids the "Already watching path" bug
      # entirely (no file watcher is started).
      # ============================================================
      - name: Prepare Android project (config-only)
        run: flutter build apk --config-only --no-tree-shake-icons

      # ============================================================
      # STEP 2: Invoke Gradle directly. flutter tool is NOT involved,
      # so its file watcher bug cannot trigger. Gradle puts the APK
      # in build/app/outputs/apk/release/app-release.apk (note: apk/,
      # not flutter-apk/ — that's why flutter couldn't find it).
      # ============================================================
      - name: Build APK via Gradle (release)
        if: steps.check_keystore.outputs.has_keystore == 'true'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Build APK via Gradle (debug fallback)
        if: steps.check_keystore.outputs.has_keystore == 'false'
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      # ============================================================
      # STEP 3: Locate the APK Gradle produced and copy it to the
      # path upload-artifact expects. We search BOTH apk/release/
      # AND flutter-apk/ because Gradle may output to either.
      # ============================================================
      - name: Locate and copy APK
        run: |
          echo "=== Searching for APK ==="
          find . -name "*.apk" -exec ls -lh {} \;
          mkdir -p build/app/outputs/flutter-apk/
          APK=$(find . -name "app-release.apk" -o -name "app-debug.apk" 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            APK=$(find . -name "*.apk" 2>/dev/null | head -1)
          fi
          if [ -z "$APK" ]; then
            echo "FATAL: No APK produced by Gradle"
            exit 1
          fi
          cp "$APK" build/app/outputs/flutter-apk/app-release.apk
          echo "Copied: $APK -> build/app/outputs/flutter-apk/app-release.apk"
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pathephon-release
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && steps.check_keystore.outputs.has_keystore == 'true'
        uses: softprops/action-gh-release@v2
        with:
          name: Pathephon ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/app-release.apk